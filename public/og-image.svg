<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1118"/>
      <stop offset="50%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#15222E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BE8"/>
      <stop offset="100%" stop-color="#22A06B"/>
    </linearGradient>
    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B8BE8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#101820" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- 3D City Silhouette Representation -->
  <g fill="url(#skylineGrad)">
    <rect x="700" y="320" width="45" height="230" rx="4"/>
    <rect x="760" y="240" width="55" height="310" rx="4"/>
    <rect x="830" y="160" width="65" height="390" rx="4"/>
    <rect x="910" y="220" width="50" height="330" rx="4"/>
    <rect x="975" y="290" width="60" height="260" rx="4"/>
    <rect x="1050" y="200" width="55" height="350" rx="4"/>
    <rect x="1120" y="350" width="45" height="200" rx="4"/>
  </g>

  <!-- Green Trendline Ribbon -->
  <path d="M 680 420 Q 820 280 940 320 T 1150 180" fill="none" stroke="#22A06B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1150" cy="180" r="10" fill="#22A06B"/>

  <!-- Logo Monogram -->
  <rect x="100" y="120" width="76" height="76" rx="18" fill="url(#brand)"/>
  <text x="138" y="174" fill="#FFFFFF" font-size="48" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">M</text>

  <!-- Wordmark -->
  <text x="195" y="172" fill="#F2F5F7" font-size="44" font-weight="900" letter-spacing="4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">MARKETVERSE</text>

  <!-- Tagline -->
  <text x="100" y="270" fill="#FFFFFF" font-size="52" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" line-height="1.2">
    The Living 3D Stock Market City
  </text>
  <text x="100" y="335" fill="#4B8BE8" font-size="32" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    Every building is a company. Every district is a sector.
  </text>

  <!-- Subtitle Bullet Features -->
  <text x="100" y="420" fill="#AAB6C2" font-size="22" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    🏛️ 36 Listed Companies  •  📊 10 Sector Districts  •  ⚡ Real-Time Shocks  •  🎓 12 Literacy Lessons
  </text>

  <!-- Badge Chip -->
  <rect x="100" y="475" width="220" height="44" rx="22" fill="#1C2B38" stroke="#4B8BE8" stroke-width="1.5"/>
  <text x="210" y="503" fill="#4B8BE8" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    Free &amp; Open Educational Sim
  </text>
</svg>
